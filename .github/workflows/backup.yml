name: Backup + очистка

# Расписание включено 2026-07-27, после того как восстановление проверено
# вживую: файл скачан, расшифрован, integrity_check ok, счётчики по шести
# таблицам сошлись с подписью. Бэкап, который ни разу не разворачивали,
# бэкапом не считается — поэтому порядок был именно такой.
#
# Очистка неподтверждённых аккаунтов живёт здесь же, а не отдельным workflow,
# ровно из-за порядка: удалять данные можно только когда архив этого дня уже
# отправлен. Отдельное расписание давало бы порядок «скорее всего», а шаг
# внутри — гарантированный: при сбое бэкапа шаги ниже не выполняются вообще.
on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Очистка неподтверждённых при ручном запуске'
        type: choice
        default: 'dry-run'
        options: ['dry-run', 'delete']
  schedule:
    - cron: '0 3 * * *'     # ежедневно 03:00 UTC = 06:00 МСК

# ВАЖНО: имена переменных здесь только латиницей. Bash не поддерживает
# не-ASCII в именах — кириллическое «вывод=$(...)» он принимает за команду
# и падает с «command not found». Комментарии на русском проблемы не создают.

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # ── Снимаем согласованную копию на томе ────────────────────────────
      - name: Снять дамп
        id: dump
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          out=$(flyctl ssh console -a energydess-tools -C "python /app/make_backup.py" 2>&1 | tr -d '\r')
          echo "$out"
          meta=$(echo "$out" | grep -o 'BACKUP_JSON=.*' | head -1 | sed 's/^BACKUP_JSON=//')
          if [ -z "$meta" ]; then
            echo "::error::Дамп не снят — скрипт не вернул BACKUP_JSON"
            exit 1
          fi
          {
            echo "meta<<METAEOF"
            echo "$meta"
            echo "METAEOF"
            echo "file=$(echo "$meta" | jq -r .file)"
            echo "path=$(echo "$meta" | jq -r .path)"
          } >> "$GITHUB_OUTPUT"

      - name: Скачать дамп с тома
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh sftp get "${{ steps.dump.outputs.path }}" "./${{ steps.dump.outputs.file }}" \
            -a energydess-tools
          ls -la "./${{ steps.dump.outputs.file }}"

      # ── Сжатие и шифрование ────────────────────────────────────────────
      - name: Зашифровать
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Секрет BACKUP_PASSPHRASE не задан — бэкап без шифрования не отправляем"
            exit 1
          fi
          gzip -9 "./${{ steps.dump.outputs.file }}"
          # Пароль передаётся файлом, а не аргументом: аргументы видны
          # в списке процессов на раннере
          printf '%s' "$PASSPHRASE" > /tmp/pass
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-file /tmp/pass \
              "./${{ steps.dump.outputs.file }}.gz"
          shred -u /tmp/pass 2>/dev/null || rm -f /tmp/pass
          rm -f "./${{ steps.dump.outputs.file }}.gz"
          ls -la "./${{ steps.dump.outputs.file }}.gz.gpg"

      # ── Проверка размера до отправки ───────────────────────────────────
      - name: Проверить размер
        run: |
          f="./${{ steps.dump.outputs.file }}.gz.gpg"
          bytes=$(stat -c%s "$f")
          mb=$(( bytes / 1024 / 1024 ))
          echo "Размер: $bytes байт (~$mb МБ)"
          # Лимит Telegram Bot API на документ — 50 МБ. Упираемся заранее,
          # чтобы узнать об этом из ошибки, а не из молчания
          if [ "$bytes" -gt 47000000 ]; then
            echo "::error::Бэкап ${mb} МБ — близко к лимиту Telegram (50 МБ). Нужен другой канал доставки."
            exit 1
          fi

      # ── Отправка ───────────────────────────────────────────────────────
      - name: Отправить в Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META: ${{ steps.dump.outputs.meta }}
        run: |
          caption=$(echo "$META" | jq -r '
            "Бэкап базы energydess\n" +
            "\nфайл: \(.file).gz.gpg" +
            "\nснят: \(.created_utc)" +
            "\nцелостность: \(.integrity)" +
            "\n\nЗаписей:" +
            "\n  пользователи: \(.counts.users)" +
            "\n  письма: \(.counts.cover_letters)" +
            "\n  дневник питания: \(.counts.food_logs)" +
            "\n  замеры веса: \(.counts.weight_logs)" +
            "\n  сообщения чатов: \(.counts.chat_messages)" +
            "\n  слоты Enshrouded: \(.counts.enshrouded_slots)" +
            "\n\nРасшифровать:\n  gpg -d \(.file).gz.gpg > \(.file).gz\n  gunzip \(.file).gz"')
          resp=$(curl -sS -w '\n%{http_code}' \
            -F "chat_id=$CHAT_ID" \
            -F "document=@./${{ steps.dump.outputs.file }}.gz.gpg" \
            -F "caption=$caption" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument")
          code=$(echo "$resp" | tail -1)
          echo "$resp" | head -n -1
          if [ "$code" != "200" ]; then
            echo "::error::Telegram не принял файл, код $code"
            exit 1
          fi
          echo "Файл отправлен"

      # ── Очистка неподтверждённых аккаунтов ─────────────────────────────
      # Шаг идёт ПОСЛЕ отправки архива и без if: always() намеренно. Упал
      # бэкап — удаления не будет: единственная страховка от ошибки в пороге
      # или в самом скрипте это архив, снятый до неё.
      #
      # По расписанию удаляем, вручную по умолчанию только считаем. Иначе
      # безобидная проверка «работает ли workflow» снесла бы аккаунты.
      - name: Удалить неподтверждённые аккаунты старше 7 дней
        id: cleanup
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'delete' || inputs.cleanup }}
        run: |
          set -o pipefail
          if [ "$MODE" = "delete" ]; then flags=""; else flags="--dry-run"; fi
          echo "Режим: $MODE"
          out=$(flyctl ssh console -a energydess-tools \
                -C "python /app/cleanup_unverified.py $flags" 2>&1 | tr -d '\r')
          echo "$out"
          # Скрипт останавливается сам, если в каскаде не учтена новая таблица.
          # Такой отказ должен ронять шаг, а не проходить незамеченным
          if echo "$out" | grep -q "ОСТАНОВЛЕНО"; then
            echo "::error::Очистка остановлена: в каскаде не учтены таблицы"
            exit 1
          fi
          # В Telegram сообщаем только когда что-то реально удалено: ежедневное
          # «удалять нечего» превратило бы канал в шум, который перестают читать
          removed=$(echo "$out" | sed -n 's/^Удалено пользователей: \([0-9]*\) из.*/\1/p')
          if [ -n "$removed" ] && [ "$removed" -gt 0 ]; then
            curl -sS -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=Очистка energydess: удалено неподтверждённых аккаунтов — $removed (старше 7 дней). Данные есть в архиве этого дня." \
              >/dev/null || true
          fi

      # ── Уборка ─────────────────────────────────────────────────────────
      - name: Удалить дамп с тома
        # always(): копия базы не должна оставаться рядом с базой, даже если
        # что-то выше сломалось
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "${{ steps.dump.outputs.path }}" ]; then
            flyctl ssh console -a energydess-tools \
              -C "rm -f ${{ steps.dump.outputs.path }}" || true
          fi

      # ── Сообщение о сбое ───────────────────────────────────────────────
      - name: Сообщить о сбое
        # Второй канал обязателен: если Telegram недоступен или токен протух,
        # это сообщение не дойдёт — и единственным сигналом останется письмо
        # от GitHub о провалившемся запуске
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=Задача «бэкап + очистка» energydess завершилась сбоем. Какой именно шаг упал — видно в логе, бэкап мог и пройти. Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

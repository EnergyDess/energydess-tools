# РЯД ПРОВЕРОК В GITHUB ACTIONS (BACKLOG №357).
#
# ЗАЧЕМ. Полный местный ряд — 69 проверок и около сорока минут перед
# каждой выкаткой. Время и контекст сессии уходили на прогон того, чего
# никто не трогал, а впереди ещё три инструмента редизайна.
#
# ЧТО ЗДЕСЬ. Состав CI ВЫВОДИТСЯ, а не перечисляется:
# `checks_registry.только_местно` называет исключения (видимое окно
# вёрстки, боевые данные, `.env`), всё остальное идёт сюда. Новая
# проверка попадает в CI сама — умолчание «не гонять» молча вывело бы
# её из-под единственного ряда, который идёт на каждый push.
#
# ДАННЫЕ ТОЛЬКО ВЫДУМАННЫЕ (§8.0, §5.1). Боевой базы и её копий здесь
# нет ни в каком виде: стенд сеет `make_local_user.py --seed`. Ключей
# моделей нет вовсе — значит живой вызов невозможен по построению,
# и это отдельный шаг, а не обещание.
name: Checks

# Ветки `ci/**` — чтобы прогнать ряд, не выкатывая прод: деплой идёт
# только с `main`. Там же проверяются подлоги (§6.0.3).
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

# Прогон на коммит один: догоняющий push отменяет предыдущий, чтобы
# замок деплоя не ждал устаревшую очередь.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# ДВЕ РАБОТЫ, А НЕ ОДНА. Основной ряд §6.0.2 читается без браузера,
# ряд стенда водит chromium: порознь их времена не складываются, а берут
# максимум, и медленный стенд не упирается в потолок работы.
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        part: [row, stand]
    name: checks (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHECKS_PART: ${{ matrix.part }}
      # ПОТОЛОК ПРОВЕРКИ В CI НИЖЕ МЕСТНОГО (2400 с). Одна висящая проба
      # съедала бы всю работу и роняла её по времени без единого имени;
      # оборванная по потолку в CI считается КРАСНОЙ, а не «не прогнанной».
      START_CHECKS_TIMEOUT: '600'
      STAND_TIMEOUT: '600'
      ROW_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v5
        with:
          # вся история: её читают проверка 9 (статус задачи против
          # коммитов) и `check_medkit_names.py` (прежняя функция из HEAD)
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # `py` — ЧАСТЬ КОМАНД РЯДА. Грепы §6.0.2 зовут `py project_lists.py
      # --names` внутри bash, и на Linux этой команды нет вовсе: ряд 1
      # молча считал НЕ ТО (в CI «5 строк, долг 2» против «36, долг 0»
      # на машине). Документ при этом прав — на Windows `python`
      # перехватывает заглушка Store (§6.0.1), — значит площадка обязана
      # дать `py`, а не документ поменять команду.
      - name: py kak python
        run: sudo ln -sf "$(command -v python)" /usr/local/bin/py

      # Кеш браузеров playwright: скачивание chromium — минута с лишним,
      # а меняется он только с версией пакета.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - run: python -m playwright install --with-deps chromium

      # ОКРУЖЕНИЕ СТЕНДА — ВЫДУМАННОЕ. Ключей моделей и сервисов здесь
      # нет: `or_key.выбрать_ключ` отдаёт пусто, и место вызова отказывает
      # с причиной, не тратя денег. Секретов в этот файл не попадает.
      - name: okruzhenie stenda
        run: |
          {
            echo 'SECRET_KEY=ci-stand-not-a-secret'
            echo 'AGENT_WEBHOOK_KEY=ci-stand-not-a-secret'
            echo 'BASE_URL=http://127.0.0.1:8899'
            echo 'DB_PATH=./app.db'
          } > .env
          cat .env

      # ПОСЕВ ОТДЕЛЬНЫМ ШАГОМ: `start_checks` сеет молча (вывод глушится),
      # и ошибка посева выглядела бы как «стенд не поднялся».
      - name: posev stenda
        run: python make_local_user.py --seed

      - name: ryad proverok
        run: python start_checks.py --ci

      # Стенд не поднялся — его журнал единственное, что об этом скажет.
      - name: log stenda
        if: failure()
        run: tail -40 .start_checks_stand.log || echo "журнала стенда нет"

      # ЖИВЫХ ВЫЗОВОВ НОЛЬ, И ЭТО ЗАМЕР, А НЕ ОБЕЩАНИЕ. Признаков два:
      # ключа нет вовсе, и в учёте расхода (§2.7) ни одной строки с ценой
      # либо номером генерации — их отдаёт только настоящий сервис.
      - name: zhivyh vyzovov nol
        if: always()
        run: |
          python - <<'PY'
          import os, sqlite3, sys
          import or_key
          ключ, причина = or_key.выбрать_ключ(os.environ)
          if ключ:
              sys.exit("ключ модели в CI НЕ ДОЛЖЕН быть задан, а он есть")
          print("ключ: пусто —", причина)
          if not os.path.exists("app.db"):
              sys.exit("базы стенда нет — прогон не состоялся")
          с = sqlite3.connect("app.db")
          живые = с.execute("SELECT COUNT(*) FROM model_usage "
                            "WHERE cost IS NOT NULL OR gen_id IS NOT NULL"
                            ).fetchone()[0]
          всего = с.execute("SELECT COUNT(*) FROM model_usage").fetchone()[0]
          print("расход: строк %d, из них живых %d" % (всего, живые))
          sys.exit(1 if живые else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-log-${{ matrix.part }}
          # отметки начинаются с точки, а v4 скрытые файлы по умолчанию
          # НЕ БЕРЁТ — артефакт выходил пустым
          include-hidden-files: true
          path: |
            .start_checks_last.txt
            .start_checks.json
            .start_checks_stand.log
          retention-days: 14

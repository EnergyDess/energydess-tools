app = "energydess-tools"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/app.db"
  BASE_URL = "https://energydess.ru"
  MODEL = "anthropic/claude-haiku-4-5"
  # LETTER_MODEL здесь НЕ задаётся: он выставлен секретом (flyctl secrets),
  # а секрет перекрывает [env]. Значение в двух местах разъезжается — в файле
  # лежало sonnet-4-5, тогда как на проде реально работал opus-4-8.
  # Приоритеты и текущие значения — в CLAUDE.md, раздел 2.

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Проверка живости. До 6 августа её не было вовсе (`flyctl config show`
# показывал `checks: null`), и это значило две вещи. Первая: прокси Fly слал
# трафик в машину сразу после старта, а uvicorn поднимается за 5-8 секунд —
# в деплое 6 августа окно между SIGINT в 19:48:27 и «Application startup
# complete» в 19:48:35 составило восемь секунд, и все восемь Fly считал
# приложение готовым. Вторая: зависший процесс, который держит порт, но
# не отвечает, никто бы не заменил — политика restart on-failure ловит только
# падение.
#
# grace_period с запасом ко времени старта: импорт main.py тянет few_shot_examples
# и модели SQLAlchemy, на shared-cpu-1x это те самые 5-8 секунд. Меньше запаса —
# и проверка начнёт валить машину на старте, то есть чинить нечиненное.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# ═══════════════════════════════════════════════════════════════════
# 256 МБ — НЕ ВЫБОР, А ПОТОЛОК ХОСТА. ПОДЪЁМ ДО 512 ЗАМЕРЕН И ОТКАЗАН
# ═══════════════════════════════════════════════════════════════════
#
# Попытка 2026-09-05, BACKLOG №242. Владелец распорядился поднять
# до 512; Fly отказал ТРИЖДЫ подряд, одним и тем же:
#
#     insufficient memory available to fulfill request on the current host
#
# Отказали и деплой, и `flyctl scale memory 512`, и `machine update`
# на ОСТАНОВЛЕННОЙ машине — то есть освобождение резерва не помогает.
#
# ДЕЛО НЕ В РЕГИОНЕ, А В КОНКРЕТНОМ ХОСТЕ, и это замер: пробная
# машина на 512 МБ в том же `fra` СОЗДАЛАСЬ и дала 469 892 kB.
# Боевую держит на месте ТОМ `data` (зона b72d) — он привязан
# к хосту, и машина с ним переехать не может.
#
# ПОЧЕМУ ВЕРНУЛИ 256, А НЕ ОСТАВИЛИ 512 «до лучших времён»:
# файл с 512 роняет КАЖДЫЙ деплой на этапе резервирования, то есть
# правки кода перестают доезжать до прода — молча, потому что
# причина лежит в чужом файле. Это худший из исходов (§6.0).
#
# ЧТО ФАКТИЧЕСКИ ДАЁТ ЭТОТ РАЗМЕР: 212 228 kB = 207 МБ, из них
# uvicorn 107 МБ. Потолок кеша `REF_CACHE_MB` (24 МБ) выведен
# из этого числа — правите размер здесь, перемеряйте его там
# (§5.8, «два потолка обхода»).
#
# УСЛОВИЕ ВОЗВРАТА К ВОПРОСУ — ЧИСЛОМ, а не «когда-нибудь»:
# BACKLOG №242 называет, при скольких позициях и источниках
# нынешних 207 МБ перестанет хватать.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

app = "energydess-tools"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/app.db"
  BASE_URL = "https://energydess.ru"
  MODEL = "anthropic/claude-haiku-4-5"
  # LETTER_MODEL здесь НЕ задаётся: он выставлен секретом (flyctl secrets),
  # а секрет перекрывает [env]. Значение в двух местах разъезжается — в файле
  # лежало sonnet-4-5, тогда как на проде реально работал opus-4-8.
  # Приоритеты и текущие значения — в CLAUDE.md, раздел 2.

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Проверка живости. До 6 августа её не было вовсе (`flyctl config show`
# показывал `checks: null`), и это значило две вещи. Первая: прокси Fly слал
# трафик в машину сразу после старта, а uvicorn поднимается за 5-8 секунд —
# в деплое 6 августа окно между SIGINT в 19:48:27 и «Application startup
# complete» в 19:48:35 составило восемь секунд, и все восемь Fly считал
# приложение готовым. Вторая: зависший процесс, который держит порт, но
# не отвечает, никто бы не заменил — политика restart on-failure ловит только
# падение.
#
# grace_period с запасом ко времени старта: импорт main.py тянет few_shot_examples
# и модели SQLAlchemy, на shared-cpu-1x это те самые 5-8 секунд. Меньше запаса —
# и проверка начнёт валить машину на старте, то есть чинить нечиненное.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# ═══════════════════════════════════════════════════════════════════
# 512 МБ. РАСШИРЕНИЕ УПИРАЛОСЬ В ХОСТ, А НЕ В РЕГИОН И НЕ В ЦЕНУ
# ═══════════════════════════════════════════════════════════════════
#
# Решение владельца 2026-09-05, BACKLOG №242. Повод замерен заходом
# 241: обход всей аптечки УБИЛ прод по OOM — из заявленных 256 машина
# имела 207 МБ, из них 107 занимал uvicorn.
#
# ПЕРВАЯ ПОПЫТКА ОТКАЗАЛА ТРИЖДЫ, одним и тем же:
#
#     insufficient memory available to fulfill request on the current host
#
# Отказали деплой, `flyctl scale memory 512` и `machine update`
# на ОСТАНОВЛЕННОЙ машине. Дело было НЕ В РЕГИОНЕ: пробная машина
# на 512 МБ в том же `fra` создалась и дала 469 892 kB. Держал
# на месте ТОМ — он привязан к хосту, и машина с ним не переезжает.
#
# ПОЛУЧИЛОСЬ ПОСЛЕ ПЕРЕЕЗДА, И ПЕРЕЕЗД СЛУЧИЛСЯ САМ. Выкатка v360
# пересоздала машину, Fly выдал новый том в ДРУГОЙ зоне (e844 вместо
# b72d) и перенёс данные; старый том ушёл в `pending_destroy`.
# На новом хосте те же 512 МБ применились с первой попытки.
#
# ЧТО ИЗ ЭТОГО СЛЕДУЕТ ДЛЯ СЛЕДУЮЩЕГО РАЗА: отказ «insufficient
# memory on the current host» — это НЕ приговор размеру, а свойство
# конкретной машины. Проверять его надо ПОСЛЕ пересоздания, а не
# считать, что размер недоступен вовсе.
#
# ПОТОЛОК КЕША ОТ ЭТОГО ЧИСЛА ЗАВИСИТ НАПРЯМУЮ. `REF_CACHE_MB`
# в main.py выведен из ФАКТИЧЕСКИ свободной памяти, а не назначен:
# правите размер здесь — перемеряйте его там (§5.8, «два потолка
# обхода»). Число в двух местах, которое правят порознь, — та же
# ловушка, что у retention снимков тома (§10).
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

app = "energydess-tools"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/app.db"
  BASE_URL = "https://energydess.ru"
  MODEL = "anthropic/claude-haiku-4-5"
  # LETTER_MODEL здесь НЕ задаётся: он выставлен секретом (flyctl secrets),
  # а секрет перекрывает [env]. Значение в двух местах разъезжается — в файле
  # лежало sonnet-4-5, тогда как на проде реально работал opus-4-8.
  # Приоритеты и текущие значения — в CLAUDE.md, раздел 2.

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Проверка живости. До 6 августа её не было вовсе (`flyctl config show`
# показывал `checks: null`), и это значило две вещи. Первая: прокси Fly слал
# трафик в машину сразу после старта, а uvicorn поднимается за 5-8 секунд —
# в деплое 6 августа окно между SIGINT в 19:48:27 и «Application startup
# complete» в 19:48:35 составило восемь секунд, и все восемь Fly считал
# приложение готовым. Вторая: зависший процесс, который держит порт, но
# не отвечает, никто бы не заменил — политика restart on-failure ловит только
# падение.
#
# grace_period с запасом ко времени старта: импорт main.py тянет few_shot_examples
# и модели SQLAlchemy, на shared-cpu-1x это те самые 5-8 секунд. Меньше запаса —
# и проверка начнёт валить машину на старте, то есть чинить нечиненное.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# ПАМЯТЬ ПОДНЯТА 256 -> 512 МБ, решение владельца 2026-09-04.
#
# Повод замерен, а не предположен: обход всей аптечки УБИЛ прод
# по OOM (BACKLOG №241). Кеш страниц второго источника весит вчетверо
# больше первого — 2480 КБ карточка против 663, — и полный кеш
# из 400 записей выходил на 402 МБ при 212 МБ, которые машина имела
# ВСЕГО из заявленных 256.
#
# ПОТОЛОК КЕША ОТ ЭТОГО ЧИСЛА ЗАВИСИТ НАПРЯМУЮ. `REF_CACHE_MB`
# в main.py выведен из фактически свободной памяти, а не назначен:
# правите размер здесь — перемерьте его там же (§5.8, «два потолка
# обхода»). Число в двух местах, которое правят порознь, — та же
# ловушка, что у retention снимков тома (§10).
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

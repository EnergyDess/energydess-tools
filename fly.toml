app = "energydess-tools"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/app.db"
  BASE_URL = "https://energydess.ru"
  MODEL = "anthropic/claude-haiku-4-5"
  # LETTER_MODEL здесь НЕ задаётся: он выставлен секретом (flyctl secrets),
  # а секрет перекрывает [env]. Значение в двух местах разъезжается — в файле
  # лежало sonnet-4-5, тогда как на проде реально работал opus-4-8.
  # Приоритеты и текущие значения — в CLAUDE.md, раздел 2.

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
